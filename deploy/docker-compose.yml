# Запуск: ./deploy/release.sh vX.Y.Z
# Обычно образы готовые: их собирает GitHub Actions на метку (.github/workflows/images.yml) и кладёт в GHCR,
# сервер только скачивает (docker compose pull). Разделы build — запасной вариант (BUILD_ON_VM=1 в release.sh).
# Секреты берутся из deploy/.env (файл не в репозитории, права 600).
name: multiframe-cabinet
services:
  api:
    image: ${IMAGE_PREFIX:-ghcr.io/paulos99/multiframe-cabinet}-api:${BUILD_ID:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Токен для скачивания образов нужен только скрипту установки, не API
      GHCR_TOKEN: ""
      # Предел памяти процесса Node (МБ). Один документ платформы при 2000 пользователях занимает до ~0,3 ГБ в памяти.
      # Под нагрузку: 2048 при 3–4 ГБ памяти на контейнер. Значения меняются в deploy/.env (API_HEAP_MB, API_MEM_LIMIT).
      NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-1536}
    mem_limit: ${API_MEM_LIMIT:-3g}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/paulos99/multiframe-cabinet}-web:${BUILD_ID:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        BUILD_ID: ${BUILD_ID:-local}
        VITE_BASE: ${VITE_BASE:-/cabinet}
        VITE_API_URL: ${VITE_API_URL:-/cabinet-api}
        VITE_DISABLE_DEMO: ${VITE_DISABLE_DEMO:-1}
        VITE_YM_ID: ${VITE_YM_ID:-}
        VITE_ANALYTICS_INGEST_URL: ${VITE_ANALYTICS_INGEST_URL:-}
        VITE_STP_PROBLEMOMER_URL: ${VITE_STP_PROBLEMOMER_URL:-}
        VITE_STP_CALCULATOR_URL: ${VITE_STP_CALCULATOR_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    security_opt:
      - no-new-privileges:true
