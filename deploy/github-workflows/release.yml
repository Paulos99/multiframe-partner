name: Выпуск (по метке vX.Y.Z)
# Срабатывает на метку v*. Проверяет код, собирает статику для /cabinet и прикладывает архив к выпуску на GitHub.
# Команда, разместившая сервис, ставит именно такую метку: ./deploy/release.sh vX.Y.Z
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Метка должна лежать на main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run test:unit
        working-directory: apps/api
      - run: npm run lint && npm run typecheck && npm run test:unit
        working-directory: apps/web
      - name: Сборка статики под /cabinet
        working-directory: apps/web
        env:
          VITE_BASE: /cabinet
          VITE_API_URL: /cabinet-api
          VITE_DISABLE_DEMO: '1'
          BUILD_ID: ${{ github.ref_name }}
        run: npx vite build
      - name: Архив и контрольная сумма
        run: |
          tar -C apps/web/dist -czf "multiframe-cabinet-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "multiframe-cabinet-${GITHUB_REF_NAME}.tar.gz" > "multiframe-cabinet-${GITHUB_REF_NAME}.sha256"
      - name: Публикация выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            "multiframe-cabinet-${GITHUB_REF_NAME}.tar.gz" "multiframe-cabinet-${GITHUB_REF_NAME}.sha256"
