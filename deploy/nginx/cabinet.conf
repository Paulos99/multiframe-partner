# Конфигурация nginx внутри образа.
# Сайт: /cabinet/   API: /cabinet-api/ (префикс срезается, в API уходит путь вида /auth/login).
# Внешний прокси (с TLS) должен пробрасывать оба префикса на этот контейнер и перезаписывать X-Forwarded-For.

map $uri $cabinet_cache {
    default                          "public, max-age=3600";
    ~^/cabinet/assets/               "public, max-age=31536000, immutable";
    ~^/cabinet/(index\.html|sw\.js|sw-sync\.js|version\.json|manifest\.webmanifest)$ "no-cache";
    /cabinet/                        "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    # Реальный адрес клиента берём из X-Forwarded-For только от доверенного внешнего прокси (частные сети).
    # Если ваш внешний прокси имеет публичный адрес — добавьте его строкой set_real_ip_from.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /cabinet-api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    location = /cabinet { return 301 /cabinet/; }

    location /cabinet/ {
        root /usr/share/nginx/html;
        add_header Cache-Control $cabinet_cache always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /cabinet/index.html;
    }

    location = / { return 302 /cabinet/; }
}
