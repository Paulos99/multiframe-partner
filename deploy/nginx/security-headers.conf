# Общие заголовки безопасности. Политика CSP пока в режиме наблюдения (Report-Only): после проверки на стенде
# переведите её в рабочий режим (см. docs/handover/SECURITY_CHECKLIST.md).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru https://storage.yandexcloud.net; font-src 'self' data:; connect-src 'self' https://mc.yandex.ru https://storage.yandexcloud.net; media-src 'self' blob: https://storage.yandexcloud.net; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
