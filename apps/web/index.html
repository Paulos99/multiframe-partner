<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MF Партнёр" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#01644f" />
    <title>Партнёрская сеть StP MultiFrame</title>
    <script>
      (function () {
        var dev = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '[::1]';
        var demo = false;
        try {
          var params = new URLSearchParams(location.search);
          var session = JSON.parse(localStorage.getItem('mf_partner_session_v2') || 'null');
          var orgId = session && session.orgId;
          demo =
            params.get('demo') === '1' ||
            localStorage.getItem('mf_demo_mode') === '1' ||
            orgId === 'org_demo' ||
            orgId === 'org_demo_spb';
        } catch (e) {}
        if (!dev && !demo) return;
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          });
        }
      })();
    </script>
  </head>
  <body>
    <script>
      try {
        if (localStorage.getItem('mf_theme') === 'dark') {
          document.body.classList.add('theme-dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
