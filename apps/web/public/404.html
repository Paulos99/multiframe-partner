<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Партнёрская сеть StP MultiFrame</title>
    <script>
      // SPA fallback for GitHub Pages project site: the base is the first path segment
      // (/multiframe-partner/, /cabinet/). Other hosts use the server-side fallback (see docs/handover).
      sessionStorage.setItem('mf-spa-redirect', location.pathname + location.search + location.hash);
      var seg = location.pathname.split('/')[1];
      location.replace(seg ? '/' + seg.replace(/[^A-Za-z0-9._-]/g, '') + '/' : '/');
    </script>
  </head>
  <body></body>
</html>
